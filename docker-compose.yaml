services:
  volt:
    build:
      context: .
      dockerfile: Dockerfile
    image: volt:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - '${VOLT_BIND_ADDRESS:-0.0.0.0}:${VOLT_PORT:-8080}:8080'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATA_DIR: /data
      WEB_DIST_DIR: /app/dist/volt/browser
      DEMO_MODE: ${DEMO_MODE:-true}
      NUT_HOST: ${NUT_HOST:-}
      NUT_NAME: ${NUT_NAME:-}
      NUT_PORT: ${NUT_PORT:-3493}
      NUT_TLS: ${NUT_TLS:-false}
      NUT_USERNAME: ${NUT_USERNAME:-}
      NUT_PASSWORD: ${NUT_PASSWORD:-}
      CLEAR_NUT_CREDENTIALS: ${CLEAR_NUT_CREDENTIALS:-false}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-5}
      DISCOVERY_INTERVAL_SECONDS: ${DISCOVERY_INTERVAL_SECONDS:-60}
      NUT_TIMEOUT_MS: ${NUT_TIMEOUT_MS:-5000}
      SAMPLE_INTERVAL_SECONDS: ${SAMPLE_INTERVAL_SECONDS:-30}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-30}
      EVENT_RETENTION_DAYS: ${EVENT_RETENTION_DAYS:-90}
      WEB_ORIGINS: ${WEB_ORIGINS:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      INFISICAL_SITE_URL: ${INFISICAL_SITE_URL:-https://us.infisical.com}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-prod}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_ID_FILE: ${INFISICAL_CLIENT_ID_FILE:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_CLIENT_SECRET_FILE: ${INFISICAL_CLIENT_SECRET_FILE:-}
      INFISICAL_DEBUG: ${INFISICAL_DEBUG:-false}
      INFISICAL_AUTH_SECRET_PATH: ${INFISICAL_AUTH_SECRET_PATH:-}
      INFISICAL_OIDC_SECRET_PATH: ${INFISICAL_OIDC_SECRET_PATH:-}
      INFISICAL_MACHINE_ID: ${INFISICAL_MACHINE_ID:-}
      INFISICAL_MACHINE_ID_FILE: ${INFISICAL_MACHINE_ID_FILE:-}
      INFISICAL_MACHINE_TOKEN: ${INFISICAL_MACHINE_TOKEN:-}
      INFISICAL_MACHINE_TOKEN_FILE: ${INFISICAL_MACHINE_TOKEN_FILE:-}
      AUTH_EMAIL: ${AUTH_EMAIL:-}
      AUTH_EMAIL_FILE: ${AUTH_EMAIL_FILE:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_PASSWORD_FILE: ${AUTH_PASSWORD_FILE:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_ISSUER_FILE: ${OIDC_ISSUER_FILE:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_ID_FILE: ${OIDC_CLIENT_ID_FILE:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_CLIENT_SECRET_FILE: ${OIDC_CLIENT_SECRET_FILE:-}
      OIDC_CLIENT_AUTH_METHOD: ${OIDC_CLIENT_AUTH_METHOD:-}
      OIDC_CLIENT_AUTH_METHOD_FILE: ${OIDC_CLIENT_AUTH_METHOD_FILE:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_REDIRECT_URI_FILE: ${OIDC_REDIRECT_URI_FILE:-}
    volumes:
      - volt-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

volumes:
  volt-data:
