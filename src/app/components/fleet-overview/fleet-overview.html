@if(rows().length>1) {
<section class="fleet-overview" aria-labelledby="fleet-overview-title">
  <div class="fleet-tabs" role="group" aria-label="Select a UPS">
    @for (row of rows(); track row.device.id) {
      <button
        type="button"
        class="fleet-tab"
        [class.selected]="state.selectedDeviceId() === row.device.id"
        [attr.aria-pressed]="state.selectedDeviceId() === row.device.id"
        [attr.aria-label]="row.device.name + ', load ' + loadLabel(row.snapshot)"
        (click)="selectDevice(row.device.id)"
      >
        <strong>{{ row.device.name }}</strong>
        <span class="fleet-load">
          <span>Load</span>
          <strong>{{ loadLabel(row.snapshot) }}</strong>
        </span>
      </button>
    } @empty {
      <p class="fleet-empty">No UPS devices are reporting.</p>
    }
  </div>
</section>
}
